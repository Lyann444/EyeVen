services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: eyeven
      MYSQL_USER: eyeven
      MYSQL_PASSWORD: eyeven_password
    ports:
      - "3306:3306"
    volumes:
      - eyeven_db_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed_form_fields.sql:/docker-entrypoint-initdb.d/02_seed_fields.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql+pymysql://eyeven:eyeven_password@db:3306/eyeven
      FLASK_ENV: development
      GLM_API_KEY: ${GLM_API_KEY:-your-glm-api-key-here}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - upload_data:/app/uploads

volumes:
  eyeven_db_data:
  upload_data:
